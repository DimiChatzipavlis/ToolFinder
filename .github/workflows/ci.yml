name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install .[dev,experiments]

      - name: Syntax smoke check
        run: |
          python -m compileall toolfinder Enterprise examples experiments

      - name: Run unit tests
        run: |
          pytest
