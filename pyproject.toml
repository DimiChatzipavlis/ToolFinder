[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "toolfinder-mcp"
version = "0.1.0"
description = "A semantic routing bridge (MCP server) that fronts one or more downstream MCP servers and selects relevant tools by dense retrieval."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "faiss-cpu>=1.7.0",
    "sentence-transformers>=2.2.0",
    "jsonschema>=4.0.0",
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
    "fastmcp>=2.0.0"
]

[project.scripts]
toolfinder-mcp = "toolfinder.mcp_server:main"

[project.optional-dependencies]
langgraph = ["langchain", "langgraph", "langchain-ollama"]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]
experiments = [
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.8.0",
    "datasets>=2.19.0",
    "accelerate>=0.30.0",
]

[tool.setuptools.packages.find]
include = ["toolfinder*"]

[tool.ruff]
line-length = 120
# Executed notebooks are generated artifacts (see experiments/build_*_notebook.py);
# lint the generators, not the generated cells.
extend-exclude = ["notebooks", "examples/ToolFinder_StepByStep.ipynb"]

[tool.ruff.lint.per-file-ignores]
# Standalone scripts bootstrap sys.path before importing the local packages.
"experiments/**" = ["E402"]
"examples/**" = ["E402"]
