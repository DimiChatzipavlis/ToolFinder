[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "toolfinder-mcp"
version = "0.1.0"
description = "A Neural Semantic Router and Execution Middleware for the Model Context Protocol (MCP)."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "faiss-cpu>=1.7.0",
    "sentence-transformers>=2.2.0",
    "jsonschema>=4.0.0",
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0"
]

[project.optional-dependencies]
langgraph = ["langchain", "langgraph", "langchain-ollama"]
enterprise = ["openclaw>=2026.3.20", "cmdop"]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]
experiments = [
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.8.0",
    "datasets>=2.19.0",
    "accelerate>=0.30.0",
]

[tool.setuptools.packages.find]
include = ["toolfinder*", "Enterprise*"]