[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "toolfinder-mcp"
version = "0.1.0"
description = "A semantic routing bridge (MCP server) that fronts one or more downstream MCP servers and selects relevant tools by dense retrieval."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "faiss-cpu>=1.7.0",
    "sentence-transformers>=2.2.0",
    "jsonschema>=4.0.0",
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
    "fastmcp>=2.0.0"
]

[project.scripts]
toolfinder-mcp = "toolfinder.mcp_server:main"

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]

[tool.setuptools.packages.find]
include = ["toolfinder*"]

[tool.ruff]
line-length = 120
# research/ is archived research material, not maintained as part of the tool.
extend-exclude = ["research"]
